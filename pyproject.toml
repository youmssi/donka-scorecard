[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "donka-scorecard"
version = "0.1.0"
description = "Build explainable statistical scorecards as Donka format-v1 packs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "optbinning==1.0.0",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
donka-scorecard = "donka_scorecard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/donka_scorecard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
